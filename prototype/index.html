<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Matchwise Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --background: #F8F9FB;
  --surface: #FFFFFF;
  --text-primary: #111318;
  --text-secondary: #475467;
  --text-tertiary: #667085;
  --border-subtle: #E4E7EC;
  --border-control: #D0D5DD;
  --accent: #3157E1;
  --accent-hover: #2646BF;
  --accent-soft: #EEF2FF;
  --success: #16865C;
  --success-soft: #ECFDF3;
  --warning-text: #93370D;
  --warning-soft: #FFFAEB;
  --warning-border: #FEDF89;
  --danger: #D92D20;
  --danger-soft: #FEF3F2;
  --r-control: 6px;
  --r-card: 8px;
  --sidebar: 232px;
  --panel: 340px;
  --focus: 0 0 0 3px rgba(49, 87, 225, .35);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--background);
  color: var(--text-primary);
  font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); text-decoration: none; }
a:hover { color: var(--accent-hover); }
button { font: inherit; color: inherit; }
:focus-visible { outline: none; box-shadow: var(--focus); border-radius: var(--r-control); }
.num { font-variant-numeric: tabular-nums; }

/* Shell */
.shell { display: flex; min-height: 100vh; }
.sidebar {
  width: var(--sidebar); flex-shrink: 0; background: var(--surface);
  border-right: 1px solid var(--border-subtle); padding: 20px 12px;
  position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 20px; font-weight: 600; font-size: 15px; }
.brand-mark { width: 26px; height: 26px; border-radius: 6px; background: var(--text-primary); display: grid; place-items: center; }
.nav a {
  display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--r-control);
  color: var(--text-secondary); font-weight: 500; margin-bottom: 2px;
}
.nav a:hover { background: var(--background); color: var(--text-primary); }
.nav a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
.nav svg { width: 18px; height: 18px; flex-shrink: 0; }
.sidebar-foot { margin-top: auto; padding: 12px 8px 0; border-top: 1px solid var(--border-subtle); font-size: 12px; color: var(--text-tertiary); }
.main { flex: 1; min-width: 0; padding: 28px 32px 48px; }
.content { max-width: 1120px; }
.with-panel { display: grid; grid-template-columns: minmax(0, 1fr) var(--panel); gap: 24px; align-items: start; }
.with-panel > * { min-width: 0; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
h1 { font-size: 28px; line-height: 1.25; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
h2 { font-size: 17px; font-weight: 600; margin: 0; }
h3 { font-size: 15px; font-weight: 600; margin: 0; }
.sub { color: var(--text-secondary); margin: 4px 0 0; }
.meta { color: var(--text-tertiary); font-size: 12px; }

/* Components */
.card { background: var(--surface); border: 1px solid var(--border-subtle); border-radius: var(--r-card); }
.card-pad { padding: 20px; }
.card-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; border-bottom: 1px solid var(--border-subtle); }
.badge {
  display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px; border-radius: 999px;
  font-size: 12px; font-weight: 500; border: 1px solid var(--border-subtle); color: var(--text-secondary); background: var(--surface);
  white-space: nowrap;
}
.badge.warn { background: var(--warning-soft); border-color: var(--warning-border); color: var(--warning-text); }
.badge.ok { background: var(--success-soft); border-color: #ABEFC6; color: var(--success); }
.badge.bad { background: var(--danger-soft); border-color: #FECDCA; color: #B42318; }
.badge.accent { background: var(--accent-soft); border-color: #C7D2FE; color: var(--accent); }
.dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.btn {
  display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px; border-radius: var(--r-control);
  border: 1px solid var(--border-control); background: var(--surface); font-weight: 500; cursor: pointer; color: var(--text-primary);
}
.btn:hover { background: var(--background); color: var(--text-primary); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { background: var(--accent-hover); color: #fff; }
.btn.block { width: 100%; justify-content: center; }
.notice {
  display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px; border-radius: var(--r-card);
  background: var(--warning-soft); border: 1px solid var(--warning-border); color: var(--warning-text); font-size: 13px; margin-bottom: 20px;
}
.notice svg { width: 16px; height: 16px; flex-shrink: 0; margin-top: 2px; }

/* Filters */
.toolbar { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--border-subtle); background: var(--surface);
  color: var(--text-secondary); font-weight: 500; font-size: 13px; cursor: pointer;
}
.chip:hover { border-color: var(--border-control); color: var(--text-primary); }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: #C7D2FE; color: var(--accent); }
.search { position: relative; margin-left: auto; }
.search input {
  height: 36px; width: 220px; padding: 0 12px 0 34px; border-radius: var(--r-control); border: 1px solid var(--border-control);
  font: inherit; background: var(--surface); color: var(--text-primary);
}
.search input:focus { outline: none; box-shadow: var(--focus); border-color: var(--accent); }
.search svg { position: absolute; left: 10px; top: 10px; width: 16px; height: 16px; color: var(--text-tertiary); }

/* Fixture list */
.day-label { font-size: 12px; font-weight: 600; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: .04em; padding: 16px 4px 8px; }
.day-label:first-child { padding-top: 0; }
.list { background: var(--surface); border: 1px solid var(--border-subtle); border-radius: var(--r-card); overflow: hidden; }
.list-head, .row {
  display: grid; grid-template-columns: 56px minmax(150px, 1fr) 210px 64px 64px 64px 20px; gap: 12px; align-items: center; padding: 0 16px;
}
.list-head { height: 36px; font-size: 12px; color: var(--text-tertiary); font-weight: 500; border-bottom: 1px solid var(--border-subtle); background: #FCFCFD; }
.list-head .r, .row .r { text-align: right; }
.row { min-height: 64px; border-bottom: 1px solid var(--border-subtle); cursor: pointer; width: 100%; background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left; }
.row:last-child { border-bottom: 0; }
.row:hover { background: #FAFBFC; }
.row[aria-selected="true"] { background: var(--accent-soft); box-shadow: inset 2px 0 0 var(--accent); }
.row:focus-visible { border-radius: 0; box-shadow: inset 0 0 0 2px var(--accent); }
.time { font-weight: 500; color: var(--text-secondary); }
.teams div { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.teams .lg { font-size: 12px; color: var(--text-tertiary); font-weight: 400; }
.x12 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.x12 span { text-align: center; padding: 4px 0; border-radius: 4px; color: var(--text-secondary); }
.x12 span small { display: block; font-size: 11px; color: var(--text-tertiary); line-height: 1.2; }
.x12 span.top { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.x12 span.top small { color: var(--accent); }
.chev { width: 16px; height: 16px; color: var(--text-tertiary); }

/* Probability bar */
.pbar { display: flex; height: 6px; border-radius: 3px; overflow: hidden; gap: 2px; }
.pbar i { display: block; height: 100%; background: #D0D5DD; }
.pbar i.top { background: var(--accent); }

/* Panel */
.panel { position: sticky; top: 28px; }
.panel .card + .card { margin-top: 16px; }
.kv { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--border-subtle); }
.kv:last-child { border-bottom: 0; }
.kv span:first-child { color: var(--text-secondary); }
.kv span:last-child { font-weight: 500; }
.empty { text-align: center; padding: 40px 20px; color: var(--text-secondary); }

/* Match detail */
.back { display: inline-flex; align-items: center; gap: 6px; color: var(--text-secondary); font-weight: 500; margin-bottom: 16px; }
.back svg { width: 16px; height: 16px; }
.outcomes { display: grid; grid-template-columns: repeat(3, 1fr); }
.outcome { padding: 20px; border-right: 1px solid var(--border-subtle); }
.outcome:last-child { border-right: 0; }
.outcome .lbl { color: var(--text-secondary); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.outcome .val { font-size: 28px; font-weight: 600; letter-spacing: -0.01em; margin: 4px 0 2px; }
.outcome.top .val { color: var(--accent); }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }
.section { margin-top: 16px; }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 10px 20px; text-align: left; border-bottom: 1px solid var(--border-subtle); }
th { font-size: 12px; font-weight: 500; color: var(--text-tertiary); background: #FCFCFD; }
tr:last-child td { border-bottom: 0; }
td.r, th.r { text-align: right; }
td.grp { font-size: 12px; font-weight: 600; color: var(--text-tertiary); background: #FCFCFD; padding-top: 8px; padding-bottom: 8px; }
.mini-bar { display: inline-block; width: 60px; height: 4px; border-radius: 2px; background: var(--border-subtle); vertical-align: middle; margin-right: 10px; position: relative; overflow: hidden; }
.mini-bar i { position: absolute; inset: 0 auto 0 0; background: var(--accent); }
.scoregrid { display: grid; grid-template-columns: 28px repeat(6, 1fr); gap: 3px; font-size: 12px; }
.scoregrid .h { color: var(--text-tertiary); display: grid; place-items: center; font-weight: 500; height: 22px; }
.scoregrid .c { height: 36px; border-radius: 4px; display: grid; place-items: center; color: var(--text-primary); }
.axis-note { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-tertiary); margin-bottom: 8px; }
.why li { margin-bottom: 8px; color: var(--text-secondary); }
.why li b { color: var(--text-primary); font-weight: 500; }
.why { padding-left: 18px; margin: 0; }
.strength-row { display: grid; grid-template-columns: 1fr 70px; gap: 8px; align-items: center; padding: 6px 0; }
.track { height: 6px; background: var(--background); border: 1px solid var(--border-subtle); border-radius: 3px; position: relative; }
.track i { position: absolute; top: -1px; bottom: -1px; left: 0; border-radius: 3px; background: var(--accent); }

/* Stats */
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; margin-bottom: 20px; }
.stat { padding: 16px 20px; border-right: 1px solid var(--border-subtle); }
.stat:last-child { border-right: 0; }
.stat .lbl { color: var(--text-secondary); font-size: 13px; }
.stat .val { font-size: 22px; font-weight: 600; margin-top: 2px; }
.res-ok { color: var(--success); font-weight: 500; }
.res-no { color: var(--text-tertiary); }

/* Mobile tab bar */
.tabbar { display: none; }

@media (max-width: 1199px) {
  .with-panel { grid-template-columns: minmax(0, 1fr); }
  .panel { display: none; }
}
@media (max-width: 899px) {
  .sidebar { display: none; }
  .main { padding: 16px 16px calc(84px + env(safe-area-inset-bottom)); }
  h1 { font-size: 24px; }
  .tabbar {
    display: grid; grid-template-columns: repeat(3, 1fr); position: fixed; bottom: 0; left: 0; right: 0; z-index: 10;
    background: var(--surface); border-top: 1px solid var(--border-subtle); padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
  }
  .tabbar a { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; font-size: 11px; font-weight: 500; color: var(--text-tertiary); min-height: 48px; justify-content: center; }
  .tabbar a[aria-current="page"] { color: var(--accent); }
  .tabbar svg { width: 22px; height: 22px; }
  .search { margin-left: 0; width: 100%; }
  .search input { width: 100%; height: 44px; font-size: 16px; }
  .search svg { top: 14px; }
  .chips { flex-wrap: nowrap; overflow-x: auto; width: 100%; padding-bottom: 2px; scrollbar-width: none; }
  .chip { flex-shrink: 0; height: 36px; }
  .list-head { display: none; }
  .row { grid-template-columns: 40px minmax(0, 1fr) 128px; padding: 12px; gap: 8px; }
  .row .hide-m { display: none; }
  .x12 span { padding: 3px 0; font-size: 13px; }
  .outcome { padding: 14px 12px; }
  .outcome .val { font-size: 22px; }
  .outcome .lbl { font-size: 12px; }
  .grid-2 { grid-template-columns: 1fr; }
  th, td { padding: 10px 12px; }
  .card-pad { padding: 16px; }
  .card-head { padding: 12px 16px; }
  .stats { grid-template-columns: 1fr 1fr; }
  .stat:nth-child(2) { border-right: 0; }
  .stat:nth-child(-n+2) { border-bottom: 1px solid var(--border-subtle); }
  .stat { padding: 14px 16px; }
  .hist-hide { display: none; }
}
@media (prefers-reduced-motion: no-preference) {
  .row, .btn, .chip, .nav a { transition: background-color .15s, color .15s, border-color .15s; }
}
</style>

<script>
/* ---------- Sample data (illustrative only) ---------- */
const LEAGUES = {

const UPCOMING = [
  ['epl', 'Arsenal', 'Chelsea', '2026-10-17T11:30:00Z'],

/* ---------- Dixon–Coles score distribution ---------- */
const RHO = -0.06, MAXG = 10;
function pois(k, l) { let p = Math.exp(-l); for (let i = 1; i <= k; i++) p *= l / i; return p; }
function tau(x, y, lh, la) {
  if (x === 0 && y === 0) return 1 - lh * la * RHO;
  if (x === 0 && y === 1) return 1 + lh * RHO;
  if (x === 1 && y === 0) return 1 + la * RHO;
  if (x === 1 && y === 1) return 1 - RHO;
  return 1;
}
function predict(lg, h, a) {
  const L = LEAGUES[lg], [ah, dh] = L.teams[h], [aa, da] = L.teams[a];
  const lh = Math.exp(L.base + L.home + ah + da), la = Math.exp(L.base + aa + dh);
  const g = []; let tot = 0;
  for (let x = 0; x <= MAXG; x++) { g[x] = []; for (let y = 0; y <= MAXG; y++) { const p = tau(x, y, lh, la) * pois(x, lh) * pois(y, la); g[x][y] = p; tot += p; } }
  let H = 0, D = 0, A = 0, btts = 0; const over = { 0.5: 0, 1.5: 0, 2.5: 0, 3.5: 0, 4.5: 0 }; const scores = [];
  for (let x = 0; x <= MAXG; x++) for (let y = 0; y <= MAXG; y++) {
    const p = g[x][y] / tot; g[x][y] = p;
    if (x > y) H += p; else if (x === y) D += p; else A += p;
    if (x > 0 && y > 0) btts += p;
    for (const k in over) if (x + y > +k) over[k] += p;
    scores.push([x, y, p]);
  }
  scores.sort((p, q) => q[2] - p[2]);
  return { lh, la, g, H, D, A, btts, over, scores };
}
const FIX = UPCOMING.map(([lg, h, a, ko], i) => ({ id: 'f' + i, lg, h, a, ko: new Date(ko), p: predict(lg, h, a) }));
const HIST = PAST.map(([lg, h, a, ko, gh, ga], i) => ({ id: 'p' + i, lg, h, a, ko: new Date(ko), gh, ga, p: predict(lg, h, a) }));

/* ---------- Formatting ---------- */
const TZ = 'Europe/London';
const fmtTime = d => d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', timeZone: TZ });
const fmtDay = d => d.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', timeZone: TZ });
const fmtShort = d => d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', timeZone: TZ });
const pct = (p, d = 0) => (p * 100).toFixed(d) + '%';
const fair = p => p > 0 ? (1 / p).toFixed(2) : '—';
const topKey = p => (p.H >= p.D && p.H >= p.A) ? 'H' : (p.A >= p.D ? 'A' : 'D');

/* ---------- Icons ---------- */
const I = {
  fixtures: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>',
  history: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg>',
  accuracy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
  chev: '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>',
  search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>',
  info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v5h1"/></svg>',
};
const NAV = [['fixtures', 'Fixtures'], ['history', 'Match history'], ['accuracy', 'Model accuracy']];

/* ---------- State & routing ---------- */
const state = { league: 'all', q: '', selected: 'f0' };
function route() {
  const [, page = 'fixtures', id] = location.hash.split('/');
  const active = page === 'match' ? 'fixtures' : page;
  const navHtml = (cls) => NAV.map(([k, label]) => `<a href="#/${k}" ${k === active ? 'aria-current="page"' : ''}>${I[k]}<span>${label}</span></a>`).join('');
  document.getElementById('nav').innerHTML = navHtml();
  document.getElementById('tabbar').innerHTML = navHtml();
  const main = document.getElementById('main');
  if (page === 'match') main.innerHTML = matchPage(id);
  else if (page === 'history') main.innerHTML = historyPage();
  else if (page === 'accuracy') main.innerHTML = accuracyPage();
  else main.innerHTML = fixturesPage();
  document.title = { match: 'Match', history: 'Match history', accuracy: 'Model accuracy' }[page] ? `${{ match: 'Match', history: 'Match history', accuracy: 'Model accuracy' }[page]} · Matchwise` : 'Fixtures · Matchwise';
  bind();
}
window.addEventListener('hashchange', () => { route(); window.scrollTo(0, 0); });

const NOTICE = `<div class="notice" role="note">${I.info}<div><b>Prototype with sample data.</b> Team ratings, fixtures and results are illustrative so you can review the design. Real predictions come from the fitted model in the next step.</div></div>`;
const MODEL_BADGE = `<span class="badge warn"><span class="dot"></span>Model not yet validated</span>`;

/* ---------- Fixtures page ---------- */
function filtered() {
  const q = state.q.trim().toLowerCase();
  return FIX.filter(f => (state.league === 'all' || f.lg === state.league) && (!q || (f.h + ' ' + f.a).toLowerCase().includes(q)))
    .sort((a, b) => a.ko - b.ko);
}
function x12(p) {
  const t = topKey(p);
  return `<div class="x12 num">${[['H', '1', p.H], ['D', 'X', p.D], ['A', '2', p.A]].map(([k, l, v]) =>
    `<span class="${k === t ? 'top' : ''}"><small>${l}</small>${pct(v)}</span>`).join('')}</div>`;
}
function fixturesList() {
  const list = filtered();
  if (!list.length) return `<div class="card empty"><h3>No fixtures match</h3><p class="sub">Try another league or clear the search.</p><button class="btn" data-reset>Clear filters</button></div>`;
  const days = {};
  list.forEach(f => (days[fmtDay(f.ko)] ||= []).push(f));
  return Object.entries(days).map(([day, fs]) => `
    <div class="day-label">${day}</div>
    <div class="list" role="listbox" aria-label="Fixtures on ${day}">
      <div class="list-head" aria-hidden="true"><span>Kick-off</span><span>Match</span><span style="text-align:center">Home · Draw · Away</span><span class="r">Over 2.5</span><span class="r">BTTS</span><span class="r">Likely</span><span></span></div>
      ${fs.map(f => `
      <button class="row" role="option" data-fix="${f.id}" aria-selected="${f.id === state.selected}">
        <span class="time num">${fmtTime(f.ko)}</span>
        <span class="teams"><div>${f.h}</div><div>${f.a}</div>${state.league === 'all' ? `<div class="lg">${LEAGUES[f.lg].name}</div>` : ''}</span>
        ${x12(f.p)}
        <span class="r num hide-m">${pct(f.p.over[2.5])}</span>
        <span class="r num hide-m">${pct(f.p.btts)}</span>
        <span class="r num hide-m">${f.p.scores[0][0]}–${f.p.scores[0][1]}</span>
        <span class="hide-m">${I.chev}</span>
      </button>`).join('')}
    </div>`).join('');
}
function quickPanel() {
  const f = FIX.find(x => x.id === state.selected) || FIX[0], p = f.p, t = topKey(p);
  const bar = [['H', p.H], ['D', p.D], ['A', p.A]].map(([k, v]) => `<i class="${k === t ? 'top' : ''}" style="width:${v * 100}%"></i>`).join('');
  return `
  <div class="card card-pad">
    <div class="meta">${LEAGUES[f.lg].name} · ${fmtShort(f.ko)} ${fmtTime(f.ko)}</div>
    <h2 style="margin:6px 0 14px">${f.h} <span style="color:var(--text-tertiary);font-weight:400">vs</span> ${f.a}</h2>
    <div class="pbar" aria-hidden="true">${bar}</div>
    <div style="display:flex;justify-content:space-between;margin:8px 0 16px" class="num">
      <span><b>${pct(p.H)}</b> <span class="meta">home</span></span><span><b>${pct(p.D)}</b> <span class="meta">draw</span></span><span><b>${pct(p.A)}</b> <span class="meta">away</span></span>
    </div>
    <div class="kv"><span>Predicted goals</span><span class="num">${p.lh.toFixed(2)} – ${p.la.toFixed(2)}</span></div>
    <div class="kv"><span>Over 2.5 goals</span><span class="num">${pct(p.over[2.5])}</span></div>
    <div class="kv"><span>Both teams score</span><span class="num">${pct(p.btts)}</span></div>
    <div class="kv"><span>Most likely score</span><span class="num">${p.scores[0][0]}–${p.scores[0][1]} (${pct(p.scores[0][2])})</span></div>
    <a class="btn primary block" style="margin-top:16px" href="#/match/${f.id}">View full analysis</a>
  </div>
  <div class="card card-pad">
    <h3 style="margin-bottom:8px">Model</h3>
    <div class="kv"><span>Method</span><span>Dixon–Coles</span></div>
    <div class="kv"><span>Data up to</span><span>12 Oct 2026</span></div>
    <div class="kv"><span>Status</span><span>${MODEL_BADGE}</span></div>
  </div>`;
}
function fixturesPage() {
  const chips = [['all', 'All leagues'], ...Object.entries(LEAGUES).map(([k, v]) => [k, v.name])]
    .map(([k, l]) => `<button class="chip" data-league="${k}" aria-pressed="${state.league === k}">${l}</button>`).join('');
  return `<div class="content">
    ${NOTICE}
    <div class="page-head"><div><h1>Fixtures</h1><p class="sub">Predictions for the next round of matches. Times shown in UK time.</p></div></div>
    <div class="with-panel">
      <div>
        <div class="toolbar"><div class="chips" role="group" aria-label="Filter by league">${chips}</div>
          <label class="search">${I.search}<input type="search" placeholder="Search teams" aria-label="Search teams" value="${state.q}" data-search></label></div>
        <div id="fixlist">${fixturesList()}</div>
      </div>
      <aside class="panel" aria-label="Selected match" id="panel">${quickPanel()}</aside>
    </div></div>`;
}

/* ---------- Match page ---------- */
function rank(lg, team, idx, desc) {
  const arr = Object.entries(LEAGUES[lg].teams).sort((a, b) => desc ? b[1][idx] - a[1][idx] : a[1][idx] - b[1][idx]);
  return arr.findIndex(([n]) => n === team) + 1;
}
const ord = n => n + (['th', 'st', 'nd', 'rd'][(n % 100 > 10 && n % 100 < 14) ? 0 : (n % 10 < 4 ? n % 10 : 0)] || 'th');
function strengthBar(v) { const w = Math.max(4, Math.min(100, (v + 0.6) / 1.2 * 100)); return `<div class="track"><i style="width:${w}%"></i></div>`; }
function matchPage(id) {
  const f = FIX.find(x => x.id === id);
  if (!f) return `<div class="content"><a class="back" href="#/fixtures">${I.back}Fixtures</a><div class="card empty"><h3>Match not found</h3><p class="sub">It may have been rescheduled or removed.</p></div></div>`;
  const p = f.p, t = topKey(p), L = LEAGUES[f.lg], n = Object.keys(L.teams).length;
  const [ah, dh] = L.teams[f.h], [aa, da] = L.teams[f.a];
  const outcome = (k, label, v) => `<div class="outcome ${k === t ? 'top' : ''}"><div class="lbl">${label}</div><div class="val num">${pct(v)}</div><div class="meta num">Fair odds ${fair(v)}</div></div>`;
  const mrow = (sel, v) => `<tr><td>${sel}</td><td class="r num"><span class="mini-bar"><i style="width:${v * 100}%"></i></span>${pct(v, 1)}</td><td class="r num">${fair(v)}</td></tr>`;
  const max = p.scores[0][2];
  let sg = `<div class="h"></div>` + [0, 1, 2, 3, 4, 5].map(y => `<div class="h">${y}</div>`).join('');
  for (let x = 0; x <= 5; x++) {
    sg += `<div class="h">${x}</div>`;
    for (let y = 0; y <= 5; y++) { const v = p.g[x][y], a = (v / max) * 0.85; sg += `<div class="c num" style="background:rgba(49,87,225,${a.toFixed(3)});color:${a > .5 ? '#fff' : 'var(--text-primary)'}" title="${f.h} ${x}–${y} ${f.a}: ${pct(v, 1)}">${pct(v, 1).replace('%', '')}</div>`; }
  }
  const why = [
    `<b>${f.h}</b> have the ${ord(rank(f.lg, f.h, 0, true))}-best attack and ${ord(rank(f.lg, f.h, 1, false))}-best defence in the ${L.name} (of ${n}).`,
    `<b>${f.a}</b> have the ${ord(rank(f.lg, f.a, 0, true))}-best attack and ${ord(rank(f.lg, f.a, 1, false))}-best defence.`,
    `Home advantage in the ${L.name} raises the home side's expected goals by about <b>${Math.round((Math.exp(L.home) - 1) * 100)}%</b>.`,
    `Together these give predicted goals of <b>${p.lh.toFixed(2)}</b> for ${f.h} and <b>${p.la.toFixed(2)}</b> for ${f.a}; every probability on this page comes from that score distribution.`,
  ];
  return `<div class="content">
    <a class="back" href="#/fixtures">${I.back}Fixtures</a>
    ${NOTICE}
    <div class="page-head"><div>
      <div class="meta" style="margin-bottom:4px">${L.name} · ${fmtDay(f.ko)} · ${fmtTime(f.ko)}</div>
      <h1>${f.h} <span style="color:var(--text-tertiary);font-weight:400">vs</span> ${f.a}</h1>
    </div>${MODEL_BADGE}</div>
    <div class="with-panel"><div>
      <div class="card outcomes">${outcome('H', f.h + ' win', p.H)}${outcome('D', 'Draw', p.D)}${outcome('A', f.a + ' win', p.A)}</div>
      <div class="grid-2">
        <div class="card"><div class="card-head"><h3>Most likely scores</h3></div>
          <table><tbody>${p.scores.slice(0, 5).map(([x, y, v]) => `<tr><td>${f.h} ${x}–${y} ${f.a}</td><td class="r num">${pct(v, 1)}</td></tr>`).join('')}</tbody></table></div>
        <div class="card card-pad"><h3 style="margin-bottom:12px">Score probabilities</h3>
          <div class="axis-note"><span>Rows: ${f.h} goals</span><span>Columns: ${f.a} goals</span></div>
          <div class="scoregrid" role="img" aria-label="Probability of each scoreline from 0–0 to 5–5">${sg}</div></div>
      </div>
      <div class="card section"><div class="card-head"><h3>Markets</h3><span class="meta">Fair odds = 1 ÷ probability</span></div>
        <table><thead><tr><th>Selection</th><th class="r">Probability</th><th class="r">Fair odds</th></tr></thead><tbody>
          <tr><td class="grp" colspan="3">Double chance</td></tr>
          ${mrow('Home or draw (1X)', p.H + p.D)}${mrow('Away or draw (X2)', p.A + p.D)}${mrow('Either team wins (12)', p.H + p.A)}
          <tr><td class="grp" colspan="3">Total goals</td></tr>
          ${[0.5, 1.5, 2.5, 3.5, 4.5].map(k => mrow(`Over ${k}`, p.over[k]) + mrow(`Under ${k}`, 1 - p.over[k])).join('')}
          <tr><td class="grp" colspan="3">Both teams to score</td></tr>
          ${mrow('Yes', p.btts)}${mrow('No', 1 - p.btts)}
        </tbody></table></div>
      <div class="card card-pad section"><h3 style="margin-bottom:12px">Why the model thinks this</h3><ul class="why">${why.map(w => `<li>${w}</li>`).join('')}</ul></div>
    </div>
    <aside class="panel" aria-label="Team strength and model details">
      <div class="card card-pad"><h3 style="margin-bottom:4px">Team strength</h3><p class="meta" style="margin:0 0 12px">Relative to the ${L.name} average</p>
        ${[[f.h, ah, dh], [f.a, aa, da]].map(([nm, at, df]) => `
          <div style="font-weight:500;margin-top:8px">${nm}</div>
          <div class="strength-row"><div>${strengthBar(at)}</div><span class="meta">Attack</span></div>
          <div class="strength-row"><div>${strengthBar(-df)}</div><span class="meta">Defence</span></div>`).join('')}
      </div>
      <div class="card card-pad"><h3 style="margin-bottom:8px">Predicted goals</h3>
        <div class="kv"><span>${f.h}</span><span class="num">${p.lh.toFixed(2)}</span></div>
        <div class="kv"><span>${f.a}</span><span class="num">${p.la.toFixed(2)}</span></div>
        <p class="meta" style="margin:8px 0 0">Model scoring rates, not shot-based xG.</p></div>
      <div class="card card-pad"><h3 style="margin-bottom:8px">Model details</h3>
        <div class="kv"><span>Method</span><span>Dixon–Coles</span></div>
        <div class="kv"><span>Trained on</span><span>Results to 12 Oct 2026</span></div>
        <div class="kv"><span>Version</span><span>v0.1 (sample)</span></div>
        <div class="kv"><span>Status</span><span>${MODEL_BADGE}</span></div></div>
    </aside></div></div>`;
}

/* ---------- History page ---------- */
function historyPage() {
  let hits = 0, brier = 0;
  const rows = HIST.slice().sort((a, b) => b.ko - a.ko).map(m => {
    const p = m.p, t = topKey(p), res = m.gh > m.ga ? 'H' : m.gh === m.ga ? 'D' : 'A', ok = t === res;
    if (ok) hits++;
    brier += ['H', 'D', 'A'].reduce((s, k) => s + Math.pow(p[k] - (k === res ? 1 : 0), 2), 0);
    const pick = { H: m.h, D: 'Draw', A: m.a }[t];
    return `<tr><td class="num hist-hide">${fmtShort(m.ko)}</td><td><div style="font-weight:500">${m.h} ${m.gh}–${m.ga} ${m.a}</div><div class="meta">${LEAGUES[m.lg].name}</div></td>
      <td class="hist-hide">${pick} <span class="meta num">${pct(p[t])}</span></td>
      <td class="r num hist-hide">${pct(p[res])}</td>
      <td class="r">${ok ? '<span class="badge ok">Correct</span>' : '<span class="badge">Missed</span>'}</td></tr>`;
  }).join('');
  const n = HIST.length;
  return `<div class="content">
    ${NOTICE}
    <div class="page-head"><div><h1>Match history</h1><p class="sub">Every past prediction against the actual result, kept exactly as it was made.</p></div></div>
    <div class="card stats">
      <div class="stat"><div class="lbl">Matches predicted</div><div class="val num">${n}</div></div>
      <div class="stat"><div class="lbl">Top pick correct</div><div class="val num">${pct(hits / n)}</div></div>
      <div class="stat"><div class="lbl">Brier score</div><div class="val num">${(brier / n).toFixed(3)}</div></div>
      <div class="stat"><div class="lbl">Bookmaker Brier</div><div class="val num" style="color:var(--text-tertiary)">—</div></div>
    </div>
    <div class="card"><table><thead><tr><th class="hist-hide">Date</th><th>Result</th><th class="hist-hide">Model's pick</th><th class="r hist-hide">Chance given to result</th><th class="r">Outcome</th></tr></thead><tbody>${rows}</tbody></table></div>
    <p class="meta" style="margin-top:12px">Brier score measures probability accuracy across home/draw/away: lower is better, 0.667 is guessing a third each.</p>
  </div>`;
}

/* ---------- Accuracy page ---------- */
function accuracyPage() {
  const cal = [[0.1, 0.08], [0.2, 0.22], [0.3, 0.29], [0.4, 0.43], [0.5, 0.47], [0.6, 0.62], [0.7, 0.66], [0.8, 0.83]];
  const W = 320, H = 240, P = 36, sx = v => P + v * (W - P - 12), sy = v => H - P - v * (H - P - 12);
  const svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Calibration chart: predicted probability against how often it happened">
    ${[0, .25, .5, .75, 1].map(v => `<line x1="${sx(0)}" x2="${sx(1)}" y1="${sy(v)}" y2="${sy(v)}" stroke="#E4E7EC"/><text x="${P - 6}" y="${sy(v) + 4}" font-size="10" fill="#667085" text-anchor="end">${v * 100}%</text><text x="${sx(v)}" y="${H - P + 16}" font-size="10" fill="#667085" text-anchor="middle">${v * 100}%</text>`).join('')}
    <line x1="${sx(0)}" y1="${sy(0)}" x2="${sx(1)}" y2="${sy(1)}" stroke="#98A2B3" stroke-dasharray="4 4"/>
    <polyline fill="none" stroke="#3157E1" stroke-width="2" points="${cal.map(([a, b]) => sx(a) + ',' + sy(b)).join(' ')}"/>
    ${cal.map(([a, b]) => `<circle cx="${sx(a)}" cy="${sy(b)}" r="3.5" fill="#fff" stroke="#3157E1" stroke-width="2"/>`).join('')}
    <text x="${sx(.5)}" y="${H - 4}" font-size="11" fill="#475467" text-anchor="middle">Predicted chance</text>
  </svg>`;
  const rows = [['Dixon–Coles (this app)', '0.981', '0.578', '52.4%', true], ['Bookmaker closing odds', '0.968', '0.571', '53.6%'], ['Simple Poisson', '0.994', '0.585', '51.1%'], ['League averages only', '1.052', '0.620', '45.2%']];
  return `<div class="content">
    <div class="notice" role="note">${I.info}<div><b>Illustrative figures.</b> This page shows the layout only. Real numbers come from replaying past seasons in the validation step.</div></div>
    <div class="page-head"><div><h1>Model accuracy</h1><p class="sub">How well the predictions held up on past seasons the model hadn't seen.</p></div>${MODEL_BADGE}</div>
    <div class="card section" style="margin-top:0"><div class="card-head"><h3>Comparison: home / draw / away</h3><span class="meta">2024–25 and 2025–26 seasons · all five leagues</span></div>
      <table><thead><tr><th>Approach</th><th class="r">Log loss</th><th class="r">Brier</th><th class="r">Top pick correct</th></tr></thead><tbody>
      ${rows.map(([n, l, b, h, me]) => `<tr${me ? ' style="background:var(--accent-soft)"' : ''}><td style="font-weight:${me ? 600 : 400}">${n}</td><td class="r num">${l}</td><td class="r num">${b}</td><td class="r num">${h}</td></tr>`).join('')}
      </tbody></table></div>
    <p class="meta" style="margin:8px 0 0">Lower log loss and Brier are better. Bookmaker odds are the strongest public benchmark.</p>
    <div class="grid-2">
      <div class="card card-pad"><h3 style="margin-bottom:4px">Calibration</h3><p class="meta" style="margin:0 0 12px">When the model says 60%, does it happen about 60% of the time? Closer to the dashed line is better.</p>${svg}</div>
      <div class="card"><div class="card-head"><h3>By league</h3></div><table><thead><tr><th>League</th><th class="r">Brier</th><th class="r">Matches</th></tr></thead><tbody>
        ${[['Premier League', '0.574', '760'], ['La Liga', '0.569', '760'], ['Serie A', '0.576', '760'], ['Bundesliga', '0.585', '612'], ['Ligue 1', '0.583', '612']].map(([a, b, c]) => `<tr><td>${a}</td><td class="r num">${b}</td><td class="r num">${c}</td></tr>`).join('')}
      </tbody></table></div>
    </div>
  </div>`;
}

/* ---------- Events ---------- */
function bind() {
  document.querySelectorAll('[data-league]').forEach(b => b.onclick = () => { state.league = b.dataset.league; route(); });
  const s = document.querySelector('[data-search]');
  if (s) s.oninput = () => { state.q = s.value; document.getElementById('fixlist').innerHTML = fixturesList(); bindRows(); };
  bindRows();
}
function bindRows() {
  document.querySelectorAll('[data-reset]').forEach(b => b.onclick = () => { state.league = 'all'; state.q = ''; route(); });
  document.querySelectorAll('[data-fix]').forEach(r => r.onclick = () => {
    if (window.innerWidth >= 1200) {
      state.selected = r.dataset.fix;
      document.querySelectorAll('[data-fix]').forEach(x => x.setAttribute('aria-selected', x === r));
      document.getElementById('panel').innerHTML = quickPanel();
    } else location.hash = '#/match/' + r.dataset.fix;
  });
}
route();
</script>
</body>
</html>
