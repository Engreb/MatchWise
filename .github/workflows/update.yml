# Refreshes results, fixtures and predictions every morning, saves them to the repository
# (so pre-kick-off snapshots are kept) and publishes the app with GitHub Pages.
name: Update predictions

on:
  schedule:
    # GitHub often starts scheduled runs 3-4 hours late (worst on the hour), so these are early
    # and at odd minutes: even a late start should land before the matches it is meant to cover.
    - cron: "17 5 * * *"   # daily, 05:17 UTC
    # Extra runs before weekend kick-offs for fresher odds (about 350 of 500 free credits a month).
    - cron: "47 10 * * 5"  # Friday 10:47 UTC (evening games)
    - cron: "47 6 * * 6"   # Saturday 06:47 UTC (early and 3pm games)
    - cron: "47 9 * * 6"   # Saturday 09:47 UTC (afternoon and evening games)
    - cron: "47 7 * * 0"   # Sunday 07:47 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install engine dependencies
        run: pip install -r engine/requirements.txt

      - name: Run tests
        working-directory: engine
        run: python -m pytest -q

      - name: Update predictions
        working-directory: engine
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python -m matchwise update

      - name: Save new data
        run: |
          git config user.name "matchwise-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/data engine/data
          git diff --cached --quiet || git commit -m "Update predictions $(date -u +%F)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deploy
        uses: actions/deploy-pages@v4
