# Refreshes results, fixtures and predictions every morning, saves them to the repository
# (so pre-kick-off snapshots are kept) and publishes the app with GitHub Pages.
name: Update predictions

on:
  schedule:
    - cron: "0 6 * * *"    # 06:00 UTC daily
    # Extra runs close to weekend kick-offs, for fresher odds (about 350 of 500 free credits a month).
    - cron: "0 15 * * 5"   # Friday 15:00 UTC
    - cron: "30 9 * * 6"   # Saturday 09:30 UTC
    - cron: "0 13 * * 6"   # Saturday 13:00 UTC
    - cron: "0 10 * * 0"   # Sunday 10:00 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install engine dependencies
        run: pip install -r engine/requirements.txt

      - name: Run tests
        working-directory: engine
        run: python -m pytest -q

      - name: Update predictions
        working-directory: engine
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python -m matchwise update

      - name: Save new data
        run: |
          git config user.name "matchwise-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/data engine/data
          git diff --cached --quiet || git commit -m "Update predictions $(date -u +%F)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deploy
        uses: actions/deploy-pages@v4
